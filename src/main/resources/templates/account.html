<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Account - Auto Spare Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<nav>
    <span class="brand">Auto Spare Pro</span>
    <a th:href="@{/catalog}">Catalog</a>
    <a th:href="@{/my-requests}">My Requests</a>
    <a th:href="@{/my-purchases}">My Purchases</a>
    <a th:href="@{/quote}">My Quote</a>
    <a th:href="@{/cart}">Cart<span th:if="${cartItemCount > 0}" class="cart-count" th:text="${cartItemCount}"></span></a>
    <a th:href="@{/account}">Account</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/}">Admin Dashboard</a>
    <span class="nav-right">
        <span class="nav-user">👤 <span th:text="${#authentication.name}"></span></span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </span>
</nav>
<div class="container">
    <h1>My Account</h1>
    <p class="subtitle">Signed in as <b th:text="${username}"></b></p>

    <div class="card">
        <h3>Change Password</h3>
        <p class="error-msg" th:if="${error}" th:text="${error}"></p>
        <p class="logout-msg" th:if="${success}" th:text="${success}"></p>
        <form class="add-form" th:action="@{/account/change-password}" method="post">
            <div class="field">
                <label>Current Password</label>
                <input type="password" name="currentPassword" required>
            </div>
            <div class="field">
                <label>New Password</label>
                <input type="password" name="newPassword" required minlength="6">
            </div>
            <div class="field">
                <label>Confirm New Password</label>
                <input type="password" name="confirmPassword" required minlength="6">
            </div>
            <button type="submit">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
