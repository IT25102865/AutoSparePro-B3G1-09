<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users - Auto Spare Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<nav>
    <span class="brand">Auto Spare Pro</span>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/inventory}">Inventory</a>
    <a th:href="@{/sales}">Sales</a>
    <a th:href="@{/damaged-stock}">Damaged Stock</a>
    <a th:href="@{/suppliers}">Suppliers</a>
    <a th:href="@{/finance}">Finance</a>
    <a th:href="@{/promotions}">Promotions</a>
    <a th:href="@{/admin/users}">Users</a>
    <a th:href="@{/admin/requests}">Requests</a>
    <a th:href="@{/admin/payments}">Payments</a>
    <a th:href="@{/catalog}">Catalog View</a>
    <span class="nav-right">
        <span class="nav-user">👤 <span th:text="${#authentication.name}"></span></span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </span>
</nav>
<div class="container">
    <h1>Manage Users</h1>
    <p class="subtitle">Create staff accounts and assign roles. Customers self-register via the Sign Up page.</p>

    <p class="error-msg" th:if="${error}" th:text="${error}"></p>
    <p class="logout-msg" th:if="${success}" th:text="${success}"></p>

    <div class="card">
        <h3>Add User</h3>
        <form class="add-form" th:action="@{/admin/users/add}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="field">
                <label>Role</label>
                <select name="role" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <button type="submit">Add User</button>
        </form>
    </div>

    <div class="card">
        <h3>All Users</h3>
        <table>
            <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${users.isEmpty()}" class="empty-row">
                <td colspan="3">No users yet.</td>
            </tr>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/edit-role'}" method="post" class="role-edit-form">
                        <select name="role" class="role-select">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option>
                        </select>
                        <button type="submit" class="edit-link role-save-btn">Save</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" style="margin:0;"
                          onsubmit="return confirm('Delete this user account?');">
                        <button type="submit" class="logout-btn">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
