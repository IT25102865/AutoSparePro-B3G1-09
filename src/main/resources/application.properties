spring.application.name=autosparepro

spring.datasource.url=jdbc:mysql://localhost:3306/autosparepro
spring.datasource.username=root
spring.datasource.password=NewPass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Render/parse dates as ISO (2026-10-06). The default locale style ("10/6/26") is
# not a valid value for <input type="date">, which left edit forms with blank dates.
spring.mvc.format.date=iso
